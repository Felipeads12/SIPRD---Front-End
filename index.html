<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AlertaTerra — Monitoramento de Desastres Naturais</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <!-- HEADER -->
    <header>
        <h1>🛰️ Alerta<span>Terra</span></h1>
    
    </header>
    <main>

    <!-- HERO -->
    <section class="hero">

    </section>

    <!-- LINKS RÁPIDOS -->
    <section class="links-rapidos">

    </section>

    <!-- DESASTRES -->
    <section id="desastres">

        <h2>
        Tipos de <span>Desastres</span>
        </h2>


    </section>

    <!-- NEWSLETTER -->
    <section id="newsletter">
        <h2>
        Receba <span>Alertas por E-mail</span>
        </h2>
        <p>
        Cadastre seu e-mail e fique por dentro dos desastres na sua região.
        </p>
        <form id="form-newsletter">
        <input
            type="email"
            id="input-email"
            placeholder="seu@email.com"
        />
        <button type="submit">
            Cadastrar
        </button>
        </form>
        <p p class="msg-erro" id="msg-erro"></p>
        <p class="msg-sucesso" id="msg-sucesso"></p>
    </section>
    </main>
    <footer>
    <p>
        &copy; 2026
        <span>AlertaTerra</span>
        — Projeto FIAP Global Solution | ADS 1º Ano
    </p>

    </footer>
    <!-- MODAL -->
    <div class="modal-fundo" id="modal-fundo">
    <div class="modal-caixa">
        <button
        class="modal-fechar"
        id="modal-fechar">
        ✕
        </button>
        <p
        id="modal-emoji"
        style="font-size:36px;margin-bottom:8px;">
        </p>
        <h3 id="modal-titulo"></h3>
        <p id="modal-texto"></p>
        <strong
        style="font-size:13px;color:#aaa;">
        O que fazer:
        </strong>
        <ul id="modal-lista"></ul>
        <a href="tel:199" class="modal-tel">
        📞 Defesa Civil: 199
        </a>
    </div>
    </div>
    <script src="js/main.js"></script>

</body>
</html>
